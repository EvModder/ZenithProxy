name: ZenithProxy Build

on:
  pull_request:
  push:
    branches: ["1.21.4"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build and run offline tests
        run: |
          mkdir -p run
          ./gradlew build -PofflineTests
          git diff --exit-code -- docs/wiki/Commands.md
          test "$(unzip -p build/libs/ZenithProxy.jar zenith_commit.txt)" = "$GITHUB_SHA"
          test "$(unzip -p build/libs/ZenithProxy.jar zenith_mc_version.txt)" = '1.21.4'
          cd build/libs
          sha256sum ZenithProxy.jar > ZenithProxy.jar.sha256
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports-${{ github.sha }}
          path: build/reports/
          retention-days: 90
      - uses: actions/upload-artifact@v7
        with:
          name: zenithproxy-1.21.4-${{ github.sha }}
          path: |
            build/libs/ZenithProxy.jar
            build/libs/ZenithProxy.jar.sha256
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    if: github.repository == 'EvModder/ZenithProxy' && github.event_name == 'push' && github.ref == 'refs/heads/1.21.4'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: zenithproxy-1.21.4-${{ github.sha }}
          path: release
      - name: Update rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check ZenithProxy.jar.sha256
          test "$(unzip -p ZenithProxy.jar zenith_commit.txt)" = "$GITHUB_SHA"
          # Never let an older queued build replace a newer branch tip.
          test "$(gh api "repos/$GH_REPO/git/ref/heads/1.21.4" --jq .object.sha)" = "$GITHUB_SHA"
          tag=latest-1.21.4
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          fi
          notes="Minecraft 1.21.4; Java 25. Commit: $GITHUB_SHA. Personal fork, not an official upstream build."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title 'Latest Minecraft 1.21.4 build' --notes "$notes" --prerelease
          else
            gh release create "$tag" --verify-tag --title 'Latest Minecraft 1.21.4 build' --notes "$notes" --prerelease
          fi
          gh release upload "$tag" ZenithProxy.jar ZenithProxy.jar.sha256 --clobber
